name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly. New advisories are published against unchanged code, so a scan
    # that only runs on push would go stale between releases.
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret committed earlier and removed later is still
          # in the history and still needs rotating.
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml

  python-sast:
    name: Python SAST & dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install "bandit[toml]" pip-audit

      - name: Bandit
        working-directory: backend
        run: bandit -c pyproject.toml -r app -f sarif -o bandit.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: backend/bandit.sarif
          category: bandit

      - name: pip-audit
        working-directory: backend
        # Reports known CVEs in the dependency tree. Non-blocking: an advisory
        # with no released fix would otherwise halt all work.
        run: pip-audit -r requirements.txt --desc || echo "::warning::pip-audit found advisories"

  node-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        # --omit=dev: a vulnerability in a build-time tool does not ship to a
        # user's browser, and treating the two alike produces noise that gets
        # ignored.
        run: npm audit --omit=dev --audit-level=high

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        run: semgrep ci --config=p/default --config=p/security-audit --config=p/owasp-top-ten --sarif --output=semgrep.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  container:
    name: Container image scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t draftforge-backend:scan ./backend

      - name: Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: draftforge-backend:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Verify the image does not run as root
        # The image previously ran as root. This keeps it from regressing.
        run: |
          USER_ID=$(docker run --rm --entrypoint id draftforge-backend:scan -u)
          echo "Container UID: $USER_ID"
          if [ "$USER_ID" = "0" ]; then
            echo "::error::Container runs as root."
            exit 1
          fi

services:
  # ============================================================================
  # 1. DraftForge FastAPI Backend Web Service
  # ============================================================================
  - type: web
    name: draftforge-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_NAME
        value: Legal Drafting AI Platform
      - key: APP_VERSION
        value: 1.0.0
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://draftforge-2-1.onrender.com,http://localhost:5173,http://localhost:3000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_REFERENCE_BUCKET
        value: reference-documents
      - key: SUPABASE_DRAFT_BUCKET
        value: student-drafts
      - key: SUPABASE_SUBMISSION_BUCKET
        value: assignment-submissions
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: legal_reference_corpus
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5

  # ============================================================================
  # 2. DraftForge React + Vite Frontend Static Site
  # ============================================================================
  - type: web
    name: draftforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://draftforge-2-d9mc.onrender.com

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    service: draftforge

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Application metrics arrive via OTLP and are re-exposed by the collector.
  - job_name: draftforge-api
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
